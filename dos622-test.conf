# DOSBox-X configuration for MS-DOS 6.22 style runtime testing.
#
# lfn=false disables the long-filename API (INT 21h/71xx) so the FAT
# filesystem presents 8.3 names only, matching bare MS-DOS 6.22 behaviour.
#
# DOSBox-X provides its own DPMI host, so CWSDPMI.EXE is not exercised
# here. To test CWSDPMI you need a DPMI-free environment (real MS-DOS 6.22
# hardware or an emulator configured without a DPMI provider).
#
# Usage:
#   dosbox-x -conf dos622-test.conf -silent -exit
#
# Before running, edit the [autoexec] section to set REPODIR to the path
# of the memex repository containing memex.exe (FAT build) and CWSDPMI.EXE.

[sdl]
output=surface
windowresolution=800x600
fullscreen=false

[dosbox]
machine=svga_s3
memsize=16

[dos]
# Disable LFN support: only 8.3 filenames are accepted by DOS.
lfn=false

[cpu]
cputype=pentium
cycles=max

[autoexec]
# Edit these mount points for your environment:
#   C: = directory containing memex.exe (FAT build) and CWSDPMI.EXE
#   S: = empty scratch directory for the smoke test
#   P: = empty scratch directory for the persistence test
mount c /path/to/memex-dos
mount s /tmp/memex-dos622-smoke
mount p /tmp/memex-dos622-persist
c:
echo Running FAT smoke test...
memex.exe --smoke-test S:\
echo Running FAT persistence test...
memex.exe --persistence-test P:\
exit
